version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: shopflow-rabbitmq
    ports:
      - "5672:5672"    # Porta do protocolo AMQP
      - "15672:15672"  # Porta do painel de controle (Management UI)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: shopflow-postgres
    environment:
      POSTGRES_DB: shopflow
      POSTGRES_USER: shopflow
      POSTGRES_PASSWORD: shopflow_pass
    ports:
      - "5432:5432"

  mongodb:
    image: mongo:6
    container_name: shopflow-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword